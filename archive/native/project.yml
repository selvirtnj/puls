name: PULS
options:
  bundleIdPrefix: de.selvir
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  PULS:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PULS
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: PULS scannt Lebensmittel-Barcodes mit deiner Kamera.
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.selvir.puls
        MARKETING_VERSION: '28.0'
        CURRENT_PROJECT_VERSION: '28'
    dependencies:
      - target: PULSActivity
    scheme:
      gatherCoverageData: false
  PULSActivity:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PULS Workout
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.selvir.puls.activity
        MARKETING_VERSION: '28.0'
        CURRENT_PROJECT_VERSION: '28'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES