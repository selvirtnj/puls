# XcodeGen-Projekt der nativen PULS-Hülle. Wird in .github/workflows/ios-app.yml auf macOS gebaut.
name: PULS
options:
  bundleIdPrefix: com.selvirtnj
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PULS:
    type: application
    platform: iOS
    sources: [PULS, Shared]
    dependencies:
      - target: PULSWidgets
    scheme: {}
    entitlements:
      path: PULS/PULS.entitlements
      properties:
        com.apple.developer.healthkit: true
    # AltStore reads requested capabilities from the binary signature, not the source .entitlements file.
    # Keep the existing certificate-free CI build; attach only an ad-hoc signature before IPA packaging.
    postBuildScripts:
      - name: AltStore capability metadata
        path: scripts/prepare-altstore.sh
        inputFiles:
          - $(SRCROOT)/PULS/PULS.entitlements
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: PULS/Info.plist
      properties:
        CFBundleDisplayName: PULS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        WKAppBoundDomains:
          - selvirtnj.github.io
        NSCameraUsageDescription: PULS nutzt die Kamera zum Scannen von Barcodes und für Fotos.
        NSMicrophoneUsageDescription: PULS nutzt das Mikrofon für die Spracheingabe.
        NSPhotoLibraryUsageDescription: PULS nutzt Fotos, wenn du ein Bild hinzufügst.
        NSHealthUpdateUsageDescription: PULS schreibt auf deinen Wunsch Gewicht und abgeschlossene Trainings in Apple Health.
        NSHealthShareUsageDescription: PULS liest auf deinen Wunsch Schritte, Schlaf, Puls, Training und Gewicht aus Apple Health und zeigt sie nur auf diesem Gerät an.
        # GPS für Läufe (RunTracker.swift), auch bei gesperrtem iPhone; nur während eines GPS-Laufs aktiv.
        NSLocationWhenInUseUsageDescription: PULS misst während eines Laufs mit GPS Distanz, Pace und Strecke.
        UIBackgroundModes:
          - location
  # Live-Aktivität für Pausen: Dynamic Island und Sperrbildschirm.
  PULSWidgets:
    type: app-extension
    platform: iOS
    sources: [PULSWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls.widgets
    info:
      path: PULSWidgets/Info.plist
      properties:
        CFBundleDisplayName: PULS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
