# XcodeGen-Projekt der nativen PULS-Hülle. Wird in .github/workflows/ios-app.yml auf macOS gebaut.
name: PULS
options:
  bundleIdPrefix: com.selvirtnj
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PULS:
    type: application
    platform: iOS
    sources: [PULS, Shared]
    dependencies:
      - target: PULSWidgets
      # Statische Bibliothek: wird gelinkt, nicht eingebettet.
      - target: PULSCore
        embed: false
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PULS/Info.plist
      properties:
        CFBundleDisplayName: PULS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        WKAppBoundDomains:
          - selvirtnj.github.io
        NSCameraUsageDescription: PULS nutzt die Kamera zum Scannen von Barcodes und für Fotos.
        NSMicrophoneUsageDescription: PULS nutzt das Mikrofon für die Spracheingabe.
        NSPhotoLibraryUsageDescription: PULS nutzt Fotos, wenn du ein Bild hinzufügst.
        # GPS für Läufe (RunTracker.swift), auch bei gesperrtem iPhone; nur während eines GPS-Laufs aktiv.
        NSLocationWhenInUseUsageDescription: PULS misst während eines Laufs mit GPS Distanz, Pace und Strecke.
        UIBackgroundModes:
          - location
  # Live-Aktivität für Pausen: Dynamic Island und Sperrbildschirm.
  PULSWidgets:
    type: app-extension
    platform: iOS
    sources: [PULSWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls.widgets
    info:
      path: PULSWidgets/Info.plist
      properties:
        CFBundleDisplayName: PULS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Nativer Kern (nur Foundation/Observation): JSONValue, Brückennachrichten, Spiegel, Outbox, ProfileStore.
  PULSCore:
    type: framework.static
    platform: iOS
    sources: [PULSCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls.core
        GENERATE_INFOPLIST_FILE: "YES"
    scheme:
      testTargets:
        - PULSCoreTests
  # Hostlose Unit-Tests; Fixtures gemeinsam mit den Web-Tests (Ordnerreferenz native-bridge im Test-Bundle).
  PULSCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PULSCoreTests
      - path: ../tests/fixtures/native-bridge
        type: folder
        buildPhase: resources
    dependencies:
      - target: PULSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selvirtnj.puls.coretests
        GENERATE_INFOPLIST_FILE: "YES"
