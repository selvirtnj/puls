name: PULS iPhone kostenlos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios-free.yml'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen bereitstellen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodebuild -version
      - name: Xcode-Projekt erzeugen
        working-directory: native
        run: xcodegen generate
      - name: iPhone-App kompilieren
        run: |
          set -o pipefail
          xcodebuild -project native/PULS.xcodeproj -scheme PULS \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build | tee build.log
      - name: IPA für AltStore packen
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PULS.app package/Payload/
          test -d package/Payload/PULS.app/PlugIns/PULSActivity.appex
          plutil -lint package/Payload/PULS.app/Info.plist
          plutil -lint package/Payload/PULS.app/PlugIns/PULSActivity.appex/Info.plist
          cd package
          /usr/bin/zip -qr PULS.ipa Payload
      - name: Installationspaket speichern
        uses: actions/upload-artifact@v4
        with:
          name: PULS-iPhone-AltStore
          path: package/PULS.ipa
          retention-days: 7
      - name: Build-Log speichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULS-Build-Log
          path: build.log
          retention-days: 3

